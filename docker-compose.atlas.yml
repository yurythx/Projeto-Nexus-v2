# Overlay OPCIONAL: IA local (Ollama) para o assistente procedural do Atlas.
# Sem ele o assistente funciona do mesmo jeito, respondendo com a síntese
# canônica dos procedimentos homologados (sem modelo de linguagem).
#
# Ligar: acrescente ao COMPOSE_FILE do .env
#   COMPOSE_FILE=docker-compose.yml:docker-compose.atlas.yml
# e rode `make deploy`; depois baixe o modelo uma vez: `make atlas-modelo`.
#
# Para um provedor externo compatível com a API da OpenAI (vLLM, LiteLLM,
# OpenAI), não use este arquivo: defina ATLAS_AI_ENDPOINT/ATLAS_AI_API_KEY
# no .env.
volumes:
  ollama_data: null

services:
  ollama:
    # Versão fixada (builds reproduzíveis); atualize conscientemente.
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.6.8}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama_data:/root/.ollama
    # Sem porta publicada: só a API o alcança, pela rede interna.
    networks:
      - nexus_internal
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  backend-api:
    environment:
      ATLAS_AI_ENDPOINT: http://ollama:11434
      ATLAS_AI_MODEL: ${ATLAS_AI_MODEL:-llama3.2}
