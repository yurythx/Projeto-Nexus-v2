# Overlay opcional para o Módulo Atlas (Busca Híbrida e IA Local)
# Ative com COMPOSE_FILE=docker-compose.yml:docker-compose.atlas.yml no .env
# ou execute:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.atlas.yml up
volumes:
  typesense_data: null
  ollama_data: null

services:
  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    command: '--data-dir /data --api-key=${TYPESENSE_API_KEY:-dev-typesense-api-key} --enable-cors'
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-api-key}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - typesense_data:/data
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_TYPESENSE_PORT:-8108}:8108"
    networks:
      - nexus_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_OLLAMA_PORT:-11434}:11434"
    networks:
      - nexus_internal
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  backend-api:
    environment:
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-api-key}
      AI_ENDPOINT: http://ollama:11434
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama3}

  backend-worker:
    environment:
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-api-key}
      AI_ENDPOINT: http://ollama:11434
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama3}
